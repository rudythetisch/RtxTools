# Coupure Internet de l'Apple TV (192.168.10.93) via pfSense
# À coller dans /config/configuration.yaml (Studio Code Server), puis redémarrer HA.
# Si une clé `rest_command:` ou `rest:` existe déjà, ajouter les entrées sous la clé existante.
#
# Secrets à ajouter dans /config/secrets.yaml :
#   pfsense_ha_user: ha-appletv
#   pfsense_ha_password: <mot de passe du compte pfSense ha-appletv>
#
# La règle pfSense est retrouvée par sa description ("Apple TV") : son ID est
# positionnel et change si les règles sont réordonnées.
# Le reste (script.appletv_internet, switch.internet_apple_tv, carte du dashboard)
# est créé dans l'UI de HA — voir docs/network/appletv-internet.md.

rest_command:
  pfsense_appletv_rule:
    url: "https://pfsense.tixhon.be/api/v2/firewall/rule"
    method: patch
    username: !secret pfsense_ha_user
    password: !secret pfsense_ha_password
    content_type: "application/json"
    payload: '{"id": {{ rule_id }}, "disabled": {{ disabled }}}'
  pfsense_apply:
    url: "https://pfsense.tixhon.be/api/v2/firewall/apply"
    method: post
    username: !secret pfsense_ha_user
    password: !secret pfsense_ha_password
    # Sans ces deux lignes, HA envoie application/octet-stream → 415, filtre jamais rechargé
    content_type: "application/json"
    payload: "{}"
  # Coupe les connexions déjà ouvertes (sinon un stream en cours continue)
  pfsense_appletv_kill_states:
    url: "https://pfsense.tixhon.be/api/v2/firewall/states?source__startswith=192.168.10.93:&limit=0"
    method: delete
    username: !secret pfsense_ha_user
    password: !secret pfsense_ha_password

rest:
  - resource: "https://pfsense.tixhon.be/api/v2/firewall/rules?descr__contains=Apple%20TV"
    authentication: basic
    username: !secret pfsense_ha_user
    password: !secret pfsense_ha_password
    scan_interval: 60
    sensor:
      - name: "Règle pfSense Apple TV"
        unique_id: pfsense_regle_apple_tv
        icon: mdi:television-off
        # bloqué = règle active ; l'attribut `id` sert au script pour le PATCH
        value_template: "{{ 'autorisé' if value_json.data[0].disabled else 'bloqué' }}"
        json_attributes_path: "$.data[0]"
        json_attributes:
          - id
          - descr
          - disabled
